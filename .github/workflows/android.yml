# Budowa aplikacji na Androida (APK) — wszystko w telefonie, bez serwera.
#
# 1. Konwersja modelu parafraz (paraphrase-multilingual-MiniLM-L12-v2) do formatu numpy
#    i weryfikacja z oryginałem (tokenizacja + cosinus embeddingów) — CI pada, jeśli się różnią.
# 2. Kopiowanie rdzenia aplikacji (app/) i modelu do projektu Androida.
# 3. Gradle + Chaquopy → podpisany APK do instalacji z pliku (artefakt "PlagCheck-<wersja>").
# 4. Nowa wersja (__version__ w app/__init__.py) na gałęzi domyślnej → GitHub Release "v<wersja>"
#    z plikiem APK — z niego instaluje i aktualizuje aplikację Obtainium.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "mobile/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # tworzenie GitHub Release dla Obtainium

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # musi zgadzać się z chaquopy.version w app/build.gradle.kts

      - name: Narzędzia ML (tylko do konwersji modelu)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "sentence-transformers==6.3.0" numpy pytest httpx -r requirements.txt

      - name: Test zgodności enkodera numpy (losowy model, transformers jako referencja)
        run: python -m pytest tests/test_minilm_numpy.py -o addopts="" -q

      - name: Cache modelu
        id: model-cache
        uses: actions/cache@v4
        with:
          path: mobile/build/model
          key: model-v1-${{ hashFiles('mobile/model/convert.py', 'app/services/minilm_numpy.py') }}

      - name: Konwersja modelu
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python mobile/model/convert.py mobile/build/model

      - name: Weryfikacja modelu z oryginałem
        run: python mobile/model/verify.py mobile/build/model

      - name: Przygotowanie źródeł Androida
        run: |
          PY=mobile/android/app/src/main/python
          rm -rf "$PY" mobile/android/app/src/main/assets/model
          mkdir -p "$PY" mobile/android/app/src/main/assets/model
          cp -R app "$PY/app"
          find "$PY" -name '__pycache__' -type d -prune -exec rm -rf {} +
          cp mobile/build/model/plagcheck_model.npz mobile/build/model/config.json mobile/android/app/src/main/assets/model/
          du -sh "$PY" mobile/android/app/src/main/assets/model

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Klucz podpisu z sekretów repozytorium
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Podpis: klucz z sekretu ANDROID_KEYSTORE_BASE64"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 — APK podpisany publicznym kluczem testowym z repozytorium."
          fi

      - name: Budowa APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Odcisk certyfikatu podpisu (do weryfikacji)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs mobile/android/app/build/outputs/apk/release/app-release.apk | tee signer.txt
          { echo "### Podpis APK"; echo '```'; grep -E "SHA-256|DN" signer.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Nazwa pliku
        id: apk
        run: |
          VERSION=$(python -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("app/__init__.py").read()).group(1))')
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "PlagCheck-$VERSION.apk"
          sha256sum "PlagCheck-$VERSION.apk" | tee "PlagCheck-$VERSION.apk.sha256"
          ls -la "PlagCheck-$VERSION.apk"
          echo "name=PlagCheck-$VERSION" >> "$GITHUB_OUTPUT"
          { echo "### 📱 PlagCheck $VERSION"; echo "APK: PlagCheck-$VERSION.apk ($(du -h "PlagCheck-$VERSION.apk" | cut -f1))"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            PlagCheck-*.apk
            PlagCheck-*.apk.sha256
          retention-days: 14
          compression-level: 0

      - name: GitHub Release dla Obtainium (tylko nowa wersja)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          VERSION="${NAME#PlagCheck-}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION już istnieje — pomijam. Aby opublikować aktualizację, podbij __version__ w app/__init__.py."
            exit 0
          fi
          SHA=$(cut -d' ' -f1 "$NAME.apk.sha256")
          printf '%s\n' \
            "Aplikacja PlagCheck na Androida — wszystko w telefonie, bez serwera." \
            "" \
            "Instalacja i aktualizacje przez Obtainium: dodaj aplikację z adresu https://github.com/${{ github.repository }}" \
            "Instrukcja: docs/ANDROID.md" \
            "" \
            "SHA-256: \`$SHA\`" > notes.md
          gh release create "v$VERSION" "$NAME.apk" "$NAME.apk.sha256" \
            --target "$GITHUB_SHA" --title "PlagCheck $VERSION" --notes-file notes.md
          echo "Opublikowano release v$VERSION" >> "$GITHUB_STEP_SUMMARY"
