name: Sonda portali

# Sprawdza, czy pobieranie stron radzi sobie z polskimi portalami (blokady, JSON-LD, archiwum).
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_portals.py
      - .github/workflows/probe-portals.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_portals.py
