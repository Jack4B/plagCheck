name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            profile: ct8          # pydantic v1, jak na serwerze
          - python: "3.13"
            profile: pydantic-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CT8 lock)
        if: matrix.profile == 'ct8'
        run: pip install --no-deps -r requirements-lock.txt && pip install pytest httpx
      - name: Install (pydantic v2)
        if: matrix.profile == 'pydantic-v2'
        run: pip install -r requirements-dev.txt "pydantic>=2,<3" numpy
      - run: pytest
      - name: Build CT8 package (fails if any dependency is not pure Python)
        if: matrix.profile == 'ct8'
        run: ./scripts/build_package.sh

  deploy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: pip install shellcheck-py && shellcheck -S warning deploy/oracle/*.sh deploy/ct8/*.sh scripts/*.sh
      - name: docker compose config (Oracle, profil https)
        run: printf 'DOMAIN=example.org\nACCESS_KEY=x\n' > .env && docker compose --profile https config --quiet
      - name: Paczka Oracle
        run: ./scripts/build_package.sh oracle
