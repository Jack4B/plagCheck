# PlagCheck — Docker (główny hosting: Oracle Cloud Always Free, patrz docs/DEPLOY_ORACLE.md)
#
#   docker compose --profile https up -d --build    # aplikacja + Caddy (HTTPS, Let's Encrypt)
#   docker compose up -d --build                    # sama aplikacja na 127.0.0.1:8000
#
# Zmienne z pliku .env: DOMAIN (dla Caddy), PLAGCHECK_PROFILE (full | lite), ACCESS_KEY, klucze API…
name: plagcheck

services:
  plagcheck:
    build:
      context: .
      args:
        PROFILE: ${PLAGCHECK_PROFILE:-full}
    env_file: .env
    environment:
      DATA_DIR: /data
      WORKER_MODE: thread
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - plagcheck-data:/data
    restart: unless-stopped
    mem_limit: ${PLAGCHECK_MEM_LIMIT:-4g}

  caddy:
    image: caddy:2
    profiles: ["https"]
    depends_on:
      - plagcheck
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  plagcheck-data:
  caddy-data:
  caddy-config:
